<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="inovaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A7142" />
      <stop offset="40%" stop-color="#C5A55F" />
      <stop offset="100%" stop-color="#A2884E" />
    </linearGradient>
    
    <!-- Dark Forest Green Gradient -->
    <linearGradient id="inovaGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3E17" />
      <stop offset="100%" stop-color="#2D5223" />
    </linearGradient>
  </defs>

  <!-- DNA Double Helix Symbol -->
  <g transform="translate(10, 5)">
    <!-- Rungs (Horizontal connection bars) -->
    <g stroke="url(#inovaGoldGrad)" stroke-width="1.3" opacity="0.75" stroke-linecap="round">
      <line x1="28" y1="80" x2="52" y2="80" />
      <line x1="33" y1="73" x2="47" y2="73" />
      <line x1="45" y1="58" x2="35" y2="58" />
      <line x1="51" y1="50" x2="29" y2="50" />
      <line x1="48" y1="42" x2="32" y2="42" />
      <line x1="41" y1="35" x2="39" y2="35" />
      <line x1="32" y1="21" x2="48" y2="21" />
    </g>

    <!-- Strand 1 (Gold Curve) -->
    <path d="M 52,88 C 52,75 46,71 40,67 C 34,63 28,58 28,46 C 28,34 34,29 40,25 C 46,21 52,17 52,10 C 52,4 46,1.5 39,1" 
          stroke="url(#inovaGoldGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Strand 2 (Dark Green Curve) -->
    <path d="M 28,88 C 28,75 34,71 40,67 C 46,63 52,58 52,46 C 52,34 46,29 40,25 C 34,21 28,17 28,10 C 28,5 31,2.5 36,1.5" 
          stroke="url(#inovaGreenGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Decorative Accent Dots -->
    <circle cx="28" cy="88" r="2.8" fill="#1E3E17" />
    <circle cx="36" cy="1.5" r="2.5" fill="url(#inovaGoldGrad)" />
    <circle cx="40" cy="67" r="2.2" fill="#1E3E17" opacity="0.9" />
  </g>

  <!-- "INOVA" Text -->
  <text x="92" y="60" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="300" letter-spacing="1.5" fill="url(#inovaGoldGrad)">INOVA</text>

  <!-- "LAB" Text -->
  <text x="245" y="60" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="600" letter-spacing="1.5" fill="#1E3E17">LAB</text>

  <!-- Tagline "CUIDANDO DA SUA SAÚDE" -->
  <text x="94" y="86" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="4.8" fill="#1E3E17">CUIDANDO DA SUA SAÚDE</text>
</svg>
